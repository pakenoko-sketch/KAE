<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#eaf4ff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>KAEDE OS</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div id="app">


    <!-- ロック画面 -->

    <section id="lockScreen">

      <div class="lockTitle">
        KAEDE OS
      </div>


      <div class="analogClock">

        <div class="clockHand hourHand"></div>

        <div class="clockHand minuteHand"></div>

        <div class="clockHand secondHand"></div>

        <div class="clockCenter"></div>

      </div>


      <div id="lockClock">

        00:00:00

      </div>


      <div id="lockDate">

        0000年00月00日

      </div>


      <div class="startText">

        ↑

        <br>

        スワイプして開始

      </div>


    </section>


  </div>


  <script src="script.js"></script>

</body>

</html>
